[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-tool-vision-expansion"
version = "0.1.0"
description = "QA-Tool 视频时间研究插件（Vision AI）：动作识别 → 作业周期 → 标准工时"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = [
    "opencv-contrib-python>=4.9,<5",
    "mediapipe>=1.0",
]
dev = ["pytest>=8"]

[project.entry-points."qa_tool.plugins"]
vision = "qa_tool_vision.plugin:VisionPlugin"

[project.scripts]
qa-tool-vision-benchmark = "qa_tool_vision.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
